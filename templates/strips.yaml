# templates/strips.yaml — ordered panel refs flowing left-to-right from the strip's top-left.
# Non-floating panels all start at strip y:0; heights may differ (skyline rows legal).
# Strip height is DERIVED (max of its panels) — no strip-level geometry fields.
# Floating panels carry explicit coords relative to the strip's top-left corner:
#   - { panel: p300x300, floating: { x: 100, y: 200 } }

strips:

# half height strips
  s_eq2_50:                
    panels:
      - panel: p5050
      - panel: p5050
      
  s_eq3_50:                
    panels:
      - panel: p3350
      - panel: p3350
      - panel: p3350


# one-third height strips
  s_eq2_33:                
    panels:
      - panel: p5033
      - panel: p5033
      
  s_eq3_33:                
    panels:
      - panel: p3333
      - panel: p3333
      - panel: p3333
      
  s_eq4_33:
    panels:
      - panel: p2533
      - panel: p2533
      - panel: p2533
      - panel: p2533
 
  s_2313_33:
      -panel: p6633
      -panel: p3333
      
  s_1323_33:
      -panel: p3333
      -panel: p6633

  s_121414_33:
      -panel: p5033
      -panel: p2533
      -panel: p2533

  s_141412_33:
      -panel: p2533
      -panel: p2533
      -panel: p5033
 
 
 # one-quarter height strips
