# templates/layouts.yaml — ordered strip/panel refs flowing top-down. One layout = one full page.
# Floating elements carry explicit coords relative to the page's top-left margin (30, 30):
#   - { panel: p300x300, floating: { x: 200, y: 200 } }
#
# Stack math for `duo`: 1714 + 20 + 1714 = 3448 — exact page fill.

layouts:
  duo:
    strips:
      - strip: eq2
      - strip: eq2
