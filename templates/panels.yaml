# templates/panels.yaml — named size presets. Width + height, nothing more.
# Page: 2480x3508 (A4 @ 300dpi). Bleed 30px -> usable 2420 x 3448. Gutter: 20px (project-level).
#
# Width math (non-floating flow, gutter 20):
#   full_width:    2420 = full usable width, exact
#   half_width:    1200 x2 + 20          = 2420, exact
#   quarter_width:  590 x4 + 20x3         = 2420, exact
#

# fixed panels (naming convention is 'p' followed by four digits representing percentage of a page in x then y; 00 equates to 100%
#              example: p0050 = full width, half height; p3333 = 1/3 width, 1/3 height


# full width panels
p0000:
  width_px: 2420
  height_px: 3448
  
p0066:
  width_px: 2420
  height_px: 2292
  
p0050:
  width_px: 2420
  height_px: 1714
  
p0033:
  width_px: 2420
  height_px: 1136

p0025:
  width_px: 2420
  height_px: 847
  
  
