# layout_02.yaml — 3-panel grid: 1 wide top, 2 bottom.
# Page: 2480x3508 (A4 at 300dpi). Bleed: 30px. Gutter: 20px.

layout_id: layout_02
display_name: "3-Panel: Wide Top, Split Bottom"
version: "1.0.0"
description: "One full-width panel on top, two equal panels on the bottom row."

page:
  width_px: 2480
  height_px: 3508
  dpi: 300

gutter_px: 20
bleed_px: 30

panels:
  - position: 1
    x: 30
    y: 30
    width_px: 2420
    height_px: 1700
    composition_hint: "Top panel — wide establishing or landscape shot."
  - position: 2
    x: 30
    y: 1750
    width_px: 1200
    height_px: 1728
    composition_hint: "Bottom-left panel — medium or close-up shot."
  - position: 3
    x: 1250
    y: 1750
    width_px: 1200
    height_px: 1728
    composition_hint: "Bottom-right panel — medium or close-up shot."
