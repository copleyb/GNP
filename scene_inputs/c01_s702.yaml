title: "Market Morning"

synopsis: |
  Morning on the market street. Alyssa moves through the stalls at an
  unhurried pace, buying fruit, watchful without seeming to watch. Hood
  shadows her from across the street, always half a stall behind. The
  street wakes up around them: vendors calling, awnings snapping open,
  a stray cat threading between legs. Alyssa clocks her tail in a
  shop window's reflection and keeps walking, changing nothing except
  her route. The scene ends with her turning down a side alley, and
  Hood following.

