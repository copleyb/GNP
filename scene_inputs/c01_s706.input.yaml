title: "Arm Wrestle"

synopsis: |
  Hood and The Enforcer arm wrestle each other in the city bar. They eye each other up menacingly,
    sit at a table and clasp hands, then arm wrestle in an increasingly strained deadlock. There
    is no resolution to the contest; the scene ends on a panel viewing the bar from the outside,
    the two contestants silhouetted in the window, still straining.    

