  s703_l01_st02_pn01:
    description: Hood, wearing his hood up as always, holds a steaming cup of noodles
      in one hand. He looks relaxed and content, preparing to leave the stand as evening
      shoppers bustle past in the background. The dim lights create long shadows across
      the market path.
    characters:
    - id: hood
    environment: city_exterior
    shot_type: medium
    mood: content
  s703_l01_st03_pn01:
    description: A stray cat, small and scruffy, suddenly darts across Hood's path.
      The cat is low to the ground, eyes wide and focused, creating a sudden rush
      of movement in the otherwise steady market scene.
    characters:
    - id: hood
    environment: city_exterior
    shot_type: close_up
    mood: unexpected
  s703_l01_st03_pn02:
    description: Hood awkwardly stumbles as he tries to avoid the cat, arms flailing,
      noodles precariously balanced in his hand. His body leans dangerously forward
      as he struggles to regain balance, showing the tension of the moment.
    characters:
    - id: hood
    environment: city_exterior
    shot_type: medium
    mood: tense
  s703_l01_st03_pn03:
    description: Hood crashes into a vendor's cart, causing it to tilt and collapse.
      The cart's contents scatter chaotically, and Hood ends up sitting amidst the
      wreckage. Noodles comically adorn his head as onlookers freeze in surprise,
      their eyes wide, while the cat scampers away unharmed.
