scene_id: s706
title: Arm Wrestle
narrative: Inside a dimly lit city bar, the air is thick with tension as Hood and
  The Enforcer lock eyes across a worn wooden table. Both men exude an aura of sheer
  determination as they sit down and clasp hands in a firm grip, each silently challenging
  the other. The venue is filled with onlookers who gather around, senses heightened
  as the arm wrestling battle begins. Muscles flex and beads of sweat appear on their
  brows as the contest escalates into a deadlock, neither willing to give an inch.
  Eyes narrow and gritted teeth outline faces locked in fierce concentration. The
  scene concludes with an outside view of the bar, capturing their silhouettes in
  the window, still straining against each other, as the world continues on, oblivious
  to the ongoing stalemate inside.
