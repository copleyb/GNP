scene_id: s704
title: Hood Upsets a Cart
narrative: Hood strolls up to a bustling hot dog stand, greeted by the vendor's cheerful
  demeanor. After exchanging a lighthearted joke, Hood digs into his pocket, pulls
  out some cash, and pays for his hot dog. With a casual wave over his shoulder, he
  walks away, savoring both his meal and the brief, friendly encounter.
elements:
