    mood: intent
  s707_l01_st02_pn02:
    description: Hood moves fluidly from his crouch, leaping effortlessly off the
      rooftop edge. His body arcs gracefully through the air, silhouetted against
      the dim sky. The night air whips around him as his figure descends towards the
      alley, arms outstretched for balance.
    characters:
    - id: hood
    environment: alley_rooftop
    shot_type: wide
    mood: dynamic
  s707_l01_st02_pn03:
    description: Hood lands softly next to Alyssa, an agile movement as his sneakers
