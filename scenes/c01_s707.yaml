  s707_l01_st01_pn01:
    description: On the rooftop, Hood crouches near the edge, next to a massive industrial
      water tower. His lean athletic form is silhouetted against the dimly lit urban
      skyline, mysterious and concealed under his hood. The graffiti-scrawled brick
      surface beside him adds gritty texture to the scene. Hood's posture is tense,
      one knee bent, the other leg stretched out behind him, weight balanced, as he
      peers intently into the alley below.
    characters:
    - id: hood
    environment: alley_rooftop
    shot_type: wide
    mood: suspenseful
  s707_l01_st01_pn02:
    description: A daring angle captures Hood's profile obscured by shadow, his hood
      pulled low over his face to conceal his features. The train tracks loom overhead,
      casting long lines of shadow across his hunched form. His gloved hand lightly
      grips the ledge of the building, ready to propel him into action at any moment.
    characters:
    - id: hood
    environment: alley_rooftop
    shot_type: low_angle
    mood: tense
  s707_l01_st01_pn03:
    description: Alyssa steps into the alley below, her figure framed by the dark
      urban environment. Her off-white technical jacket stands out against the stone-colored
