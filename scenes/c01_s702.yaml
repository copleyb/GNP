scene_id: s702
title: Market Morning
narrative: In the early hours of the day, Alyssa strolls through the bustling market
  street, a portrait of casual alertness as she moves meanderly from stall to stall.
  Vendors begin their day with energetic calls, setting up their awnings as a stray
  cat weaves between the market-goers. Alyssa is aware of a shadow trailing her—a
  figure known as Hood—who seamlessly blends into the crowd, staying just out of her
  immediate sphere. Alyssa uses her reflection in a shop window to confirm Hood's
  presence but keeps her demeanor unchanged and diverts her path slightly. The scene
  culminates as Alyssa confidently turns down a narrow side alley, acknowledging Hood's
  persistent pursuit without turning to look back.
