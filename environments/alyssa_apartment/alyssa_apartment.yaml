    file: alyssa_apartment/ref_establishing.png
    purpose: establishing_shot
    priority: 1
    notes: "Wide shot of the apartment interior with beautiful calm light."
  - ref_id: ref_kitchen
    file: alyssa_apartment/ref_kitchen.png
    purpose: detail
    priority: 2
    notes: "Shot of the apartment interior, focused on the kitchen area."
