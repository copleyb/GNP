scenes:
- scene_id: '1'
  panels:
  - page: '1_1'
    position: 1
    narrative: Alyssa stands in her apartment, center stage, basking in morning sunlight
      coming through venetian blinds that cut across the room.
  - page: '1_1'
    position: 2
    narrative: Alyssa is on the right side of the panel, tying her boots with her
      braid neatly falling over her shoulder.
- scene_id: '2'
  panels:
  - page: '1_2'
    position: 1
    narrative: Hood navigates the crowded market, left of center, blending with the
      environment despite his distinct attire.
  - page: '1_2'
    position: 2
    narrative: Hood reacts sharply as the camera zooms in on his face, showing his
      surprise and immediate attempt to identify the jostler.
  - page: '1_2'
    position: 3
    narrative: Hood is moving briskly, slightly weaving through the market as he tries
      to spot the jostler amidst bustling activity.
  - page: '1_3'
    position: 1
    narrative: Hood emerges between market stalls, his path clearly driven, as vendors
      and shoppers involuntarily part.
  - page: '1_3'
    position: 2
    narrative: From above, the market's maze appears vivid and bustling, with Hood's
      path visible by the ripple effect he causes.
  - page: '1_3'
    position: 3
    narrative: The mask of Hood's hood partially hides his intentful expression, the
      market scene blurred behind him.
  - page: '1_3'
    position: 4
    narrative: The stranger is seen briefly in motion turning the corner, with Hood
      slightly out of breath and in pursuit.
  - page: '1_3'
    position: 5
    narrative: Hood halts at the corner, peering down the now-empty alley, frustration
      barely showing through his composed posture.
  - page: '1_3'
    position: 6
    narrative: The alley appears cloaked in shadow with erratic reflections, creating
      tension as the viewer digests the emptiness.
  - page: '1_3'
    position: 7
    narrative: Hood, exhaling, makes the decision to abandon the chase and return,
      filling the panel's center.
- scene_id: '3'
  panels:
  - page: '1_4'
    position: 1
    narrative: Alyssa is centrally located, poised and observational among the different
      market stalls, with morning light highlighting her figure.
  - page: '1_4'
    position: 2
    narrative: Alyssa, now more composed and laid-back, selects celery from a vendor's
      display on the left with contentment.
- scene_id: '4'
  panels:
  - page: '1_5'
    position: 1
    narrative: Hood is right of center at the bar, reflective jacket providing stark
      contrast against the bar's dark interior.
  - page: '1_5'
    position: 2
    narrative: Hood's manner is sluggish as the drink provides a temporary solace,
      the focus is slightly blurred around him.
  - page: '1_5'
    position: 3
    narrative: An uptick in tempo as Hood's empty glass connects with the bar, eyes
      slightly defiant, as the bartender remains passive.
  - page: '1_6'
    position: 1
    narrative: Hood assumes a wobbling pose, vocal cords strained, drawing amused
      attention from others seated around him.
  - page: '1_6'
    position: 2
    narrative: The bar scene is rowdy, patrons react variably, some amused, some indifferent
      to Hood's growing disruption.
  - page: '1_6'
    position: 3
    narrative: The close-up reveals Hood's gesturing hand, contrast sinking in as
      the bartender maintains a steady presence.
  - page: '1_6'
    position: 4
    narrative: Tension configures through severe angular depiction of Hood's outburst
      against the unyielding bar environment.
  - page: '1_6'
    position: 5
    narrative: The camera shows Hood's back as he exits the bar, ignored by indifferent
      regulars, signaling disengagement.
  - page: '1_6'
    position: 6
    narrative: Hood's departure leaves an impression as the bar's door light casts
      exaggerated shadows trailing behind him.
  - page: '1_6'
    position: 7
    narrative: The panel's focus on the empty glass underscores the night’s end, ice
      shifted to hint at closure.
